name: Python Function CI/CD

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

  deploy:
    name: Deploy Azure Function
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Deployment Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target=".python_packages/lib/site-packages" -r requirements.txt
          zip -r functionapp.zip function_app.py host.json requirements.txt .python_packages

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Package to Azure Storage
        run: |
          az storage blob upload \
            --account-name cicdfunctionsrg99c3 \
            --container-name function-packages \
            --name functionapp.zip \
            --file functionapp.zip \
            --auth-mode login \
            --content-type application/zip \
            --overwrite true

      - name: Configure Function App Package
        run: |
          az functionapp config appsettings set \
            --name cicd-functions-vavila \
            --resource-group cicd-functions-rg \
            --settings \
              WEBSITE_RUN_FROM_PACKAGE=https://cicdfunctionsrg99c3.blob.core.windows.net/function-packages/functionapp.zip \
              WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID=/subscriptions/b022d96f-a31a-4b40-9da4-8a4ae456a039/resourceGroups/cicd-functions-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/cicd-function-reader-identity

      - name: Restart Function App
        run: |
          az functionapp restart \
            --name cicd-functions-vavila \
            --resource-group cicd-functions-rg

      - name: Sync Function Triggers
        run: |
          az functionapp sync-function-triggers \
            --name cicd-functions-vavila \
            --resource-group cicd-functions-rg
